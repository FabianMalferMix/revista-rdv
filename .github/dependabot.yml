version: 2
updates:
  # Dependencias Python. Con el flujo pip-compile, Dependabot actualiza los
  # requirements*.in y recompila los lockfiles (requirements*.txt) con hashes.
  # Las minor/patch se agrupan en un PR; los saltos MAJOR llegan sueltos (revisión
  # deliberada). Django se mantiene en la línea 5.2 LTS (soporte hasta 2028): solo
  # parches 5.2.x, no el salto a 6.x.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]

  # Acciones usadas en los workflows (checkout, setup-python, etc.).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Imagen base del Dockerfile. La versión de Python (3.12) se cambia de forma
  # deliberada: se ignoran los saltos major/minor (3.13/3.14) y solo se aceptan
  # reconstrucciones de parche.
  #
  # Las imágenes van fijadas por DIGEST (sha256), no solo por tag: así Dependabot puede
  # proponer la actualización del digest cuando la base se reconstruye con parches del
  # sistema operativo. Con un tag sin componente de parche («3.12-slim») esta entrada era
  # inerte por construcción (hallazgo S-34).
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "python"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  # El Dockerfile del sidecar de respaldos no lo cubría ninguna entrada: quedaba fuera
  # del radar pese a manejar la base de datos completa.
  - package-ecosystem: docker
    directory: /infra/backup
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # Imágenes declaradas en los docker-compose (postgres, redis, caddy), que el
  # ecosistema `docker` NO cubre porque solo analiza Dockerfiles (hallazgo S-35).
  # `docker-compose` es un ecosistema propio y verificado contra el esquema oficial de
  # SchemaStore antes de añadirlo: una entrada con un nombre inválido detendría TODAS
  # las actualizaciones, que sería peor que la carencia.
  #
  # Como las imágenes van fijadas por DIGEST, lo que propone son actualizaciones de
  # digest: exactamente lo que interesa para recoger los parches del sistema operativo
  # de la imagen base.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Los saltos de versión mayor se deciden a mano (postgres 16→17 exige migrar el
      # directorio de datos; redis y caddy pueden cambiar comportamiento).
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "caddy"
        update-types: ["version-update:semver-major"]
