version: 2
updates:
  # Dependencias Python. Con el flujo pip-compile, Dependabot actualiza los
  # requirements*.in y recompila los lockfiles (requirements*.txt) con hashes.
  # Las minor/patch se agrupan en un PR; los saltos MAJOR llegan sueltos (revisión
  # deliberada). Django se mantiene en la línea 5.2 LTS (soporte hasta 2028): solo
  # parches 5.2.x, no el salto a 6.x.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]

  # Acciones usadas en los workflows (checkout, setup-python, etc.).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Imagen base del Dockerfile. La versión de Python (3.12) se cambia de forma
  # deliberada: se ignoran los saltos major/minor (3.13/3.14) y solo se aceptan
  # reconstrucciones de parche.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "python"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
