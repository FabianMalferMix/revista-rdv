version: 2
updates:
  # Dependencias Python. Con el flujo pip-compile, Dependabot actualiza los
  # requirements*.in y recompila los lockfiles (requirements*.txt) con hashes.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]

  # Acciones usadas en los workflows (checkout, setup-python, etc.).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Imagen base del Dockerfile (python:3.12-slim).
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
