name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: resenas
          POSTGRES_USER: resenas
          POSTGRES_PASSWORD: resenas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resenas"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "1" # los tests corren en modo desarrollo; la config prod se valida aparte
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements-dev.txt

      - name: Lint y formato (ruff)
        working-directory: backend
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Auditoría de dependencias (pip-audit, bloqueante)
        run: |
          pip install pip-audit
          # Audita el lockfile completo (runtime + dev). Bloqueante: falla el CI
          # ante cualquier CVE conocido en una dependencia fijada. Se ignora, de
          # forma documentada, una única advertencia SOLO de desarrollo:
          #   PYSEC-2026-1845 — carrera en /tmp de pytest (herramienta de test
          #   local; nunca entra en la imagen de producción, que instala solo
          #   requirements.txt). Revisar al subir pytest a >=9.0.3.
          pip-audit -r backend/requirements-dev.txt --ignore-vuln PYSEC-2026-1845

      - name: Verificar migraciones al día
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Ejecutar tests (con cobertura medida)
        working-directory: backend
        # Umbral de cobertura: falla el CI si baja del 80% (config en pyproject.toml).
        run: pytest --cov=apps --cov-report=term-missing --cov-fail-under=80

      - name: Validar configuración de producción (check --deploy)
        working-directory: backend
        env:
          DJANGO_DEBUG: "0"
          # Clave ≥50 chars con suficientes caracteres únicos (evita security.W009).
          DJANGO_SECRET_KEY: ci-prod-secret-Kx7mQ9vLpZ4wR8nT3bY6cF1jH5dG0sA2eU7oI4aN9qW
          POSTGRES_PASSWORD: ci-strong-db-password
          DJANGO_ALLOWED_HOSTS: ci.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://ci.example.com
        # --deploy corre las security.W*; --fail-level WARNING las hace bloqueantes.
        run: python manage.py check --deploy --fail-level WARNING
