name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: resenas
          POSTGRES_USER: resenas
          POSTGRES_PASSWORD: resenas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resenas"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "1" # los tests corren en modo desarrollo; la config prod se valida aparte
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r backend/requirements-dev.txt

      - name: Lint y formato (ruff)
        working-directory: backend
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Auditoría de dependencias (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --desc || true   # no bloqueante por ahora

      - name: Verificar migraciones al día
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Ejecutar tests
        working-directory: backend
        run: pytest

      - name: Validar configuración de producción (DEBUG=0)
        working-directory: backend
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-prod-secret-key-larga-y-unica
          POSTGRES_PASSWORD: ci-strong-db-password
          DJANGO_ALLOWED_HOSTS: ci.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://ci.example.com
        run: python manage.py check
