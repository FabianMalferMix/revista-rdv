name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: resenas
          POSTGRES_USER: resenas
          POSTGRES_PASSWORD: resenas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resenas"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "1" # los tests corren en modo desarrollo; la config prod se valida aparte
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements-dev.txt

      - name: Lint y formato (ruff)
        working-directory: backend
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Auditoría de dependencias (pip-audit, bloqueante)
        run: |
          pip install pip-audit
          # Audita el lockfile completo (runtime + dev). Bloqueante: falla el CI
          # ante cualquier CVE conocido en una dependencia fijada. Se ignora, de
          # forma documentada, una única advertencia SOLO de desarrollo:
          #   PYSEC-2026-1845 — carrera en /tmp de pytest (herramienta de test
          #   local; nunca entra en la imagen de producción, que instala solo
          #   requirements.txt). Revisar al subir pytest a >=9.0.3.
          pip-audit -r backend/requirements-dev.txt --ignore-vuln PYSEC-2026-1845

      - name: Verificar migraciones al día
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Reversibilidad de migraciones (ida y vuelta)
        working-directory: backend
        # makemigrations --check solo detecta migraciones faltantes, no su
        # reversibilidad. Aquí se aplica todo, se revierte hasta 0008 —ejercitando el
        # reverse_sql de las migraciones no triviales: triggers FTS de 0009/0011 y los
        # datos de 0010— y se reaplica, sobre la BD limpia del servicio (no la de tests).
        run: |
          python manage.py migrate
          python manage.py migrate content 0008
          python manage.py migrate

      - name: Ejecutar tests (con cobertura medida)
        working-directory: backend
        # Umbral de cobertura: falla el CI si baja del 80% (config en pyproject.toml).
        # Incluye apps y config (la middleware CSP y el logging entran al gate).
        run: pytest --cov=apps --cov=config --cov-report=term-missing --cov-fail-under=80

      - name: Umbrales de cobertura por módulo (código sensible)
        working-directory: backend
        # Reutiliza el .coverage del paso anterior. Estos módulos —saneo de HTML,
        # feeds y sitemap: superficie de seguridad y descubrimiento— deben mantenerse
        # muy cubiertos; el piso global del 80% no basta para protegerlos.
        run: |
          coverage report --include="*/content/sanitize.py" --fail-under=100
          coverage report --include="*/content/feeds.py" --fail-under=100
          coverage report --include="*/content/sitemaps.py" --fail-under=90

      - name: Validar configuración de producción (check --deploy)
        working-directory: backend
        env:
          DJANGO_DEBUG: "0"
          # Clave ≥50 chars con suficientes caracteres únicos (evita security.W009).
          DJANGO_SECRET_KEY: ci-prod-secret-Kx7mQ9vLpZ4wR8nT3bY6cF1jH5dG0sA2eU7oI4aN9qW
          POSTGRES_PASSWORD: ci-strong-db-password
          DJANGO_ALLOWED_HOSTS: ci.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://ci.example.com
        # --deploy corre las security.W*; --fail-level WARNING las hace bloqueantes.
        run: python manage.py check --deploy --fail-level WARNING

  # Ejercita la imagen de producción y su lockfile de runtime (nunca cubiertos por
  # el job `test`, que instala requirements-dev): construye el stage prod (con
  # --require-hashes) y arranca gunicorn como smoke a /healthz/.
  build-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construir imagen de producción
        run: docker build --target prod -t resenas-prod ./backend

      - name: Smoke de arranque (gunicorn + /healthz/)
        run: |
          # DEBUG=1 evita el guard de producción y la validación de Host; --entrypoint
          # salta el migrate (healthz no toca la BD). Corre como usuario no-root (uid 1000).
          docker run -d --name prod-smoke -p 8000:8000 \
            -e DJANGO_DEBUG=1 -e DJANGO_SECRET_KEY=ci-smoke-key \
            --entrypoint gunicorn resenas-prod \
            config.wsgi:application --bind 0.0.0.0:8000 --workers 2
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/healthz/ && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/healthz/ | grep -qx ok
          echo "--- id del contenedor (debe ser uid 1000 no-root) ---"
          docker exec prod-smoke id
          docker logs prod-smoke
          docker rm -f prod-smoke

      - name: Smoke del pipeline de estáticos de producción (collectstatic + manifiesto)
        env:
          DJANGO_SECRET_KEY: ci-prod-secret-Kx7mQ9vLpZ4wR8nT3bY6cF1jH5dG0sA2eU7oI4aN9qW
          POSTGRES_PASSWORD: ci-strong-db-password
          DJANGO_ALLOWED_HOSTS: ci.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://ci.example.com
        run: |
          # Ejercita la ruta REAL de estáticos de producción, que el smoke de gunicorn
          # NO cubre (corre con DEBUG=1 y --entrypoint gunicorn, saltándose el
          # entrypoint donde vive collectstatic). Con DEBUG=0 el entrypoint corre
          # collectstatic con VendoredStaticFilesStorage (hash + manifiesto WhiteNoise,
          # con vendor/tinymce/ exento del hash). Sin BD: DJANGO_SKIP_MIGRATE=1.
          docker run --name prod-static \
            -e DJANGO_DEBUG=0 -e DJANGO_SKIP_MIGRATE=1 -e DJANGO_COLLECTSTATIC=1 \
            -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            -e DJANGO_ALLOWED_HOSTS="$DJANGO_ALLOWED_HOSTS" \
            -e DJANGO_CSRF_TRUSTED_ORIGINS="$DJANGO_CSRF_TRUSTED_ORIGINS" \
            resenas-prod true
          docker cp prod-static:/app/staticfiles/staticfiles.json staticfiles.json
          docker rm -f prod-static
          python3 - <<'PY'
          import json
          m = json.load(open("staticfiles.json"))["paths"]
          # 1) Un estático propio queda hasheado (el manifiesto lo mapea a otro nombre).
          site = [k for k in m if k.endswith("css/site.css")]
          assert site and m[site[0]] != site[0], "css/site.css no quedó hasheado"
          # 2) TinyMCE queda SIN hash: su carga perezosa relativa se rompería si no.
          tiny = [k for k in m if k.startswith("vendor/tinymce/")]
          assert tiny, "no hay entradas de vendor/tinymce/ en el manifiesto"
          assert all(m[k] == k for k in tiny), "vendor/tinymce/ fue hasheado (no debería)"
          print(f"OK: {len(m)} entradas, {len(tiny)} de tinymce sin hash, site.css -> {m[site[0]]}")
          PY

      - name: Escaneo de vulnerabilidades de la imagen prod (trivy, informativo)
        # Informativo (continue-on-error): CVEs HIGH/CRITICAL con fix en la imagen.
        # Se instala el CLI en vez de usar la acción (evita depender de una versión
        # concreta de la action). Promover a bloqueante cuando se decida el umbral.
        continue-on-error: true
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --format table resenas-prod

  # Gates de seguridad estática: secretos (gitleaks) y SAST (bandit), más la revisión
  # de dependencias del PR. Independientes de la BD/imagen, corren en paralelo.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks escanea todo el historial

      - name: Escaneo de secretos (gitleaks, bloqueante)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-banner --redact -c .gitleaks.toml

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: SAST (bandit, severidad media+, bloqueante)
        run: |
          python -m pip install --upgrade pip bandit
          bandit -r backend/apps backend/config -ll

      - name: Revisión de dependencias del PR (informativo)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@v4

  # Ejercita el CAMINO DE PRODUCCIÓN real (DEBUG=0) sirviendo peticiones, que la
  # suite (DEBUG=1) y el smoke de gunicorn (DEBUG=1, solo /healthz/) no cubren:
  # cabeceras de seguridad, /readyz/ con BD+broker, estático hasheado por WhiteNoise
  # y los healthchecks de compose de web/worker/beat (#23, #24, #25). Levanta db y
  # redis como contenedores en una red propia (misma receta validada localmente).
  prod-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construir imagen de producción
        run: docker build --target prod -t resenas-prod ./backend

      - name: Camino de producción DEBUG=0 + healthchecks de compose
        run: |
          docker network create qa13net
          docker run -d --name qa13-db --network qa13net \
            -e POSTGRES_DB=resenas -e POSTGRES_USER=resenas \
            -e POSTGRES_PASSWORD=ci-strong-db-password postgres:16
          docker run -d --name qa13-redis --network qa13net redis:7
          for i in $(seq 1 30); do
            docker exec qa13-db pg_isready -U resenas >/dev/null 2>&1 && break
            sleep 2
          done

          COMMON="-e DJANGO_DEBUG=0 \
            -e DJANGO_SECRET_KEY=ci-prod-secret-Kx7mQ9vLpZ4wR8nT3bY6cF1jH5dG0sA2eU7oI4aN9qW \
            -e POSTGRES_HOST=qa13-db -e POSTGRES_DB=resenas -e POSTGRES_USER=resenas \
            -e POSTGRES_PASSWORD=ci-strong-db-password \
            -e CELERY_BROKER_URL=redis://qa13-redis:6379/0 \
            -e CELERY_RESULT_BACKEND=redis://qa13-redis:6379/1 \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DJANGO_CSRF_TRUSTED_ORIGINS=https://localhost"

          # web (DEBUG=0): el entrypoint migra + collectstatic (VendoredStaticFilesStorage).
          docker run -d --name prod-web --network qa13net $COMMON \
            -e DJANGO_COLLECTSTATIC=1 -e DJANGO_SECURE_SSL_REDIRECT=0 resenas-prod

          echo "Esperando a gunicorn (migrate + collectstatic)..."
          for i in $(seq 1 40); do
            docker exec prod-web python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/',timeout=3)" 2>/dev/null && break
            sleep 3
          done

          echo "--- /healthz/ = ok ---"
          docker exec prod-web python -c "import urllib.request as u; assert u.urlopen('http://127.0.0.1:8000/healthz/',timeout=5).read().strip()==b'ok'"
          echo "--- /readyz/ = 200 ready (BD + broker) ---"
          docker exec prod-web python -c "import urllib.request as u,json; r=u.urlopen('http://127.0.0.1:8000/readyz/',timeout=5); assert r.status==200 and json.load(r)['status']=='ready'"
          echo "--- / con cabeceras de seguridad (camino DEBUG=0) ---"
          docker exec prod-web python -c "import urllib.request as u,sys; h=u.urlopen('http://127.0.0.1:8000/',timeout=5).headers; sys.exit(0 if all(h.get(x) for x in ['Content-Security-Policy','X-Frame-Options','X-Content-Type-Options','Permissions-Policy']) else 1)"
          echo "--- estático hasheado servido por WhiteNoise ---"
          docker exec prod-web python -c "import json,urllib.request as u; hh=json.load(open('/app/staticfiles/staticfiles.json'))['paths']['css/site.css']; assert u.urlopen('http://127.0.0.1:8000/static/'+hh,timeout=5).status==200"
          echo "--- healthcheck web de compose ---"
          docker exec prod-web python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5).status==200 else 1)"

          echo "--- worker y beat + sus healthchecks de compose ---"
          docker run -d --name prod-worker --network qa13net $COMMON -e DJANGO_SKIP_MIGRATE=1 \
            --entrypoint celery resenas-prod -A config worker -l warning
          docker run -d --name prod-beat --network qa13net $COMMON -e DJANGO_SKIP_MIGRATE=1 \
            --entrypoint celery resenas-prod -A config beat -l warning --schedule /app/celerybeat-schedule
          sleep 20
          docker exec prod-worker sh -c 'celery -A config inspect ping -d celery@$(hostname) -t 10 >/dev/null 2>&1'
          docker exec prod-beat python -c "import os,sys,time; f='/app/celerybeat-schedule'; sys.exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f)<300 else 1)"
          echo "OK: camino de producción DEBUG=0 y healthchecks de web/worker/beat verificados"

  # Verifica la recuperación ante desastre (DR): que un respaldo pg_dump del esquema
  # REAL (con triggers FTS, extensión unaccent y datos de migración) se pueda restaurar
  # íntegro. Ni backup.sh ni restore.sh se ejercitaban en ningún test/CI.
  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construir imagen de producción
        run: docker build --target prod -t resenas-prod ./backend

      - name: Roundtrip de respaldo/restauración (pg_dump → pg_restore)
        run: |
          docker network create bknet
          docker run -d --name bk-db --network bknet \
            -e POSTGRES_DB=resenas -e POSTGRES_USER=resenas \
            -e POSTGRES_PASSWORD=ci-strong-db-password postgres:16
          for i in $(seq 1 30); do
            docker exec bk-db pg_isready -U resenas >/dev/null 2>&1 && break
            sleep 2
          done
          # Migra el esquema REAL con la imagen prod (triggers FTS, extensión unaccent,
          # páginas legales de migración).
          docker run --rm --network bknet \
            -e DJANGO_DEBUG=0 \
            -e DJANGO_SECRET_KEY=ci-prod-secret-Kx7mQ9vLpZ4wR8nT3bY6cF1jH5dG0sA2eU7oI4aN9qW \
            -e POSTGRES_HOST=bk-db -e POSTGRES_DB=resenas -e POSTGRES_USER=resenas \
            -e POSTGRES_PASSWORD=ci-strong-db-password \
            -e DJANGO_ALLOWED_HOSTS=localhost -e DJANGO_CSRF_TRUSTED_ORIGINS=https://localhost \
            --entrypoint python resenas-prod manage.py migrate
          PG="docker exec -e PGPASSWORD=ci-strong-db-password bk-db"
          ORIG=$($PG psql -U resenas -d resenas -tAc "SELECT count(*) FROM content_page;")
          # Respaldo: pg_dump --format=custom (igual que backup.sh).
          $PG pg_dump -U resenas -d resenas --format=custom --file=/tmp/db.dump
          # Restauración en BD limpia con los flags de restore.sh.
          $PG psql -U resenas -d postgres -qc "CREATE DATABASE restored;"
          $PG pg_restore -U resenas -d restored --clean --if-exists --no-owner --no-acl /tmp/db.dump
          REST=$($PG psql -U resenas -d restored -tAc "SELECT count(*) FROM content_page;")
          TRG=$($PG psql -U resenas -d restored -tAc "SELECT count(*) FROM pg_trigger WHERE tgname LIKE '%search_vector_trg';")
          EXT=$($PG psql -U resenas -d restored -tAc "SELECT count(*) FROM pg_extension WHERE extname='unaccent';")
          echo "content_page orig=$ORIG restaurado=$REST | triggers FTS=$TRG | unaccent=$EXT"
          test "$ORIG" = "$REST" && test "$ORIG" -gt 0 && test "$TRG" = "2" && test "$EXT" = "1"
          echo "OK: respaldo restaurado íntegro (datos + triggers FTS + extensión)"
          docker rm -f bk-db >/dev/null && docker network rm bknet >/dev/null
