name: CI

on:
  push:
    branches: [main]
  pull_request:
  # pip-audit y trivy solo corrían al haber commits: un CVE publicado sobre el código
  # ya fijado no se detectaba mientras el repositorio estuviera quieto (S-34).
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC

# Mínimo privilegio para el GITHUB_TOKEN (hallazgo S-33). Sin este bloque, el token
# hereda los permisos por defecto del repositorio, que en muchas configuraciones
# incluyen escritura sobre el contenido: un paso comprometido —y este workflow ejecuta
# binarios descargados de terceros— podría empujar commits. Los jobs que necesiten más
# lo declaran ellos mismos.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "1" # los tests corren en modo desarrollo; la config prod se valida aparte
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # El compose la toma de aquí para crear la base. Es también la de `check --deploy`: el
      # guard de producción rechaza la de desarrollo, y ese paso consulta la base.
      POSTGRES_PASSWORD: ci-strong-db-password
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v7

      # La base y Redis del compose, con sus imágenes fijadas por digest: un PR de Dependabot
      # que cambia una se prueba con la nueva. ci/docker-compose.test.yml las publica en el
      # runner, donde corre pytest.
      - name: Base de datos y Redis del compose
        run: |
          touch .env
          docker compose -f docker-compose.yml -f ci/docker-compose.test.yml up -d --wait db redis

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install "pip==26.3"
          pip install --require-hashes -r backend/requirements-dev.txt

      - name: Lint y formato (ruff)
        working-directory: backend
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Auditoría de dependencias (pip-audit, bloqueante)
        run: |
          pip install "pip-audit==2.10.1"  # versión fijada: resultado reproducible (S-33)
          # Audita el lockfile completo (runtime + dev). Bloqueante: falla el CI
          # ante cualquier CVE conocido en una dependencia fijada.
          #
          # Ya NO se ignora PYSEC-2026-1845 (carrera en /tmp de pytest): la nota que
          # había aquí decía «revisar al subir pytest a >=9.0.3», y con pytest 9.1.1 la
          # advertencia desaparece. Sin exclusiones: cada una es un punto ciego que
          # sobrevive a su motivo si nadie la revisa.
          pip-audit -r backend/requirements-dev.txt

      - name: Verificar migraciones al día
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Reversibilidad de migraciones (ida y vuelta)
        working-directory: backend
        # makemigrations --check solo detecta migraciones faltantes, no su
        # reversibilidad. Aquí se aplica todo, se revierte hasta 0008 —ejercitando el
        # reverse_sql de las migraciones no triviales: triggers FTS de 0009/0011 y los
        # datos de 0010— y se reaplica, sobre la BD limpia del servicio (no la de tests).
        run: |
          python manage.py migrate
          python manage.py migrate content 0008
          python manage.py migrate

      - name: Ejecutar tests (con cobertura medida)
        working-directory: backend
        # Umbral de cobertura: falla el CI si baja del 80% (config en pyproject.toml).
        # Incluye apps y config (la middleware CSP y el logging entran al gate). En paralelo,
        # un proceso por CPU (pytest-xdist): cada uno con su propia base de pruebas.
        run: pytest -n auto --cov=apps --cov=config --cov-report=term-missing --cov-fail-under=80

      - name: Umbrales de cobertura por módulo (código sensible)
        working-directory: backend
        # Reutiliza el .coverage del paso anterior. Estos módulos —saneo de HTML,
        # feeds y sitemap: superficie de seguridad y descubrimiento— deben mantenerse
        # muy cubiertos; el piso global del 80% no basta para protegerlos.
        run: |
          coverage report --include="*/content/sanitize.py" --fail-under=100
          coverage report --include="*/content/feeds.py" --fail-under=100
          coverage report --include="*/content/sitemaps.py" --fail-under=90

      - name: Validar configuración de producción (check --deploy)
        working-directory: backend
        env:
          DJANGO_DEBUG: "0"
          # Clave ≥50 chars con suficientes caracteres únicos (evita security.W009).
          DJANGO_SECRET_KEY: ci-prod-secret-Kx7mQ9vLpZ4wR8nT3bY6cF1jH5dG0sA2eU7oI4aN9qW
          POSTGRES_PASSWORD: ci-strong-db-password
          DJANGO_ALLOWED_HOSTS: ci.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://ci.example.com
          SITE_URL: https://ci.example.com
          DJANGO_ALLOW_WEAKENED: SENTRY_DSN
          DEFAULT_FROM_EMAIL: no-reply@ci.example.com
          # El guard exige contraseña en las URL efectivas de Redis; este paso no se conecta.
          CELERY_BROKER_URL: redis://:ci-check-password@localhost:6379/0
          CACHE_URL: redis://:ci-check-password@localhost:6379/2
        # --deploy corre las security.W*; --fail-level WARNING las hace bloqueantes.
        run: python manage.py check --deploy --fail-level WARNING

  # Ejercita la imagen de producción y su lockfile de runtime (nunca cubiertos por
  # el job `test`, que instala requirements-dev): construye el stage prod (con
  # --require-hashes) y arranca gunicorn como smoke a /healthz/.
  build-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construir imagen de producción
        run: docker build --target prod -t resenas-prod ./backend

      - name: Smoke de arranque (gunicorn + /healthz/)
        run: |
          # El comando de la imagen, con las opciones de gunicorn.conf.py. DEBUG=1 evita el
          # guard de producción y la validación de Host (healthz no toca la BD). Corre como
          # usuario no-root (uid 1000).
          docker run -d --name prod-smoke -p 8000:8000 \
            -e DJANGO_DEBUG=1 -e DJANGO_SECRET_KEY=ci-smoke-key resenas-prod
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/healthz/ && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/healthz/ | grep -qx ok
          echo "--- id del contenedor (debe ser uid 1000 no-root) ---"
          docker exec prod-smoke id
          docker logs prod-smoke
          docker rm -f prod-smoke

      - name: Smoke del pipeline de estáticos de producción (collectstatic + manifiesto)
        env:
          DJANGO_SECRET_KEY: ci-prod-secret-Kx7mQ9vLpZ4wR8nT3bY6cF1jH5dG0sA2eU7oI4aN9qW
          POSTGRES_PASSWORD: ci-strong-db-password
          DJANGO_ALLOWED_HOSTS: ci.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://ci.example.com
          SITE_URL: https://ci.example.com
          DJANGO_ALLOW_WEAKENED: SENTRY_DSN
          DEFAULT_FROM_EMAIL: no-reply@ci.example.com
        run: |
          # Ejercita la ruta REAL de estáticos de producción, que el smoke de gunicorn
          # NO cubre (corre con DEBUG=1). Con DEBUG=0, collectstatic usa
          # VendoredStaticFilesStorage (hash + manifiesto WhiteNoise, con vendor/tinymce/
          # exento del hash). No necesita la BD.
          docker run --name prod-static --entrypoint python \
            -e DJANGO_DEBUG=0 \
            -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            -e REDIS_PASSWORD=ci-strong-redis-password \
            -e DJANGO_ALLOWED_HOSTS="$DJANGO_ALLOWED_HOSTS" \
            -e DJANGO_CSRF_TRUSTED_ORIGINS="$DJANGO_CSRF_TRUSTED_ORIGINS" \
            -e SITE_URL="$SITE_URL" \
            -e DJANGO_ALLOW_WEAKENED="$DJANGO_ALLOW_WEAKENED" \
            -e DEFAULT_FROM_EMAIL="$DEFAULT_FROM_EMAIL" \
            resenas-prod manage.py collectstatic --noinput
          docker cp prod-static:/app/staticfiles/staticfiles.json staticfiles.json
          docker rm -f prod-static
          python3 - <<'PY'
          import json
          m = json.load(open("staticfiles.json"))["paths"]
          # 1) Un estático propio queda hasheado (el manifiesto lo mapea a otro nombre).
          site = [k for k in m if k.endswith("css/site.css")]
          assert site and m[site[0]] != site[0], "css/site.css no quedó hasheado"
          # 2) TinyMCE queda SIN hash: su carga perezosa relativa se rompería si no.
          tiny = [k for k in m if k.startswith("vendor/tinymce/")]
          assert tiny, "no hay entradas de vendor/tinymce/ en el manifiesto"
          assert all(m[k] == k for k in tiny), "vendor/tinymce/ fue hasheado (no debería)"
          print(f"OK: {len(m)} entradas, {len(tiny)} de tinymce sin hash, site.css -> {m[site[0]]}")
          PY

      - name: Escaneo de vulnerabilidades de la imagen prod (trivy)
        # Bloquea las vulnerabilidades críticas que ya tienen corrección; las altas se listan,
        # sin bloquear. El binario viene de una release fijada y se verifica su sha256 antes
        # de ejecutarlo.
        env:
          TRIVY_VERSION: "0.72.0"
          TRIVY_SHA256: "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"
        run: |
          TARBALL="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$TARBALL" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${TARBALL}"
          echo "${TRIVY_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" trivy
          ./trivy image --severity HIGH --ignore-unfixed --format table resenas-prod
          ./trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 --format table resenas-prod

  # Gates de seguridad estática: secretos (gitleaks) y SAST (bandit), más la revisión
  # de dependencias del PR. Independientes de la BD/imagen, corren en paralelo.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Higiene del repositorio (pre-commit, bloqueante)
        # Espacios, YAML, archivos de más de 2 MB, la sintaxis de los guiones (node --check)
        # y los identificadores de decisión en el código (tools/ci/decision_refs.py). ruff y
        # gitleaks se saltan porque ya corren, bloqueantes, en los jobs test y security. La
        # versión va fijada, como la de bandit.
        env:
          SKIP: ruff-check,ruff-format,gitleaks
        run: |
          python -m pip install "pip==26.3"
          python -m pip install "pre-commit==4.7.0"
          pre-commit run --all-files --show-diff-on-failure

  # Los guiones del sitio, ejecutados en un navegador: la suite de Python solo lee su texto.
  # Levanta el stack de desarrollo con la copia de backend/datos_de_desarrollo/ y corre
  # tools/ux/browser-smoke.js a 951 y a 375 px, con el Chrome que trae el runner.
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/ux/package-lock.json

      - name: Herramientas de Node (playwright-core y ESLint, del lockfile de tools/ux)
        run: npm ci --prefix tools/ux

      - name: ESLint de los guiones (ES2020, sin módulos)
        run: tools/ux/node_modules/.bin/eslint -c tools/ux/eslint.config.mjs backend/static/js

      - name: Levantar el sitio con los datos de desarrollo
        run: |
          cp .env.example .env
          # `up` espera a que el release migre antes de arrancar web.
          docker compose up -d --build web
          docker compose exec -T web python manage.py datos_de_desarrollo cargar
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/healthz/ && break
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:8000/

      - name: Prueba de humo en navegador (951 y 375 px)
        run: |
          google-chrome --version
          node tools/ux/browser-smoke.js --base http://127.0.0.1:8000

      - name: Registro del sitio, si algo falló
        if: failure()
        run: docker compose logs --no-color release web

  security:
    runs-on: ubuntu-latest
    # dependency-review-action necesita leer el PR además del contenido; se le concede
    # solo a este job en vez de subir el permiso a todo el workflow.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks escanea todo el historial

      - name: Escaneo de secretos (gitleaks, bloqueante)
        # Se verifica el sha256 del tarball ANTES de extraerlo y ejecutarlo (S-33): antes
        # se canalizaba directo a `tar -xz`, sin comprobar nada.
        env:
          GITLEAKS_VERSION: "8.21.2"
          GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" gitleaks
          ./gitleaks detect --no-banner --redact -c .gitleaks.toml

      - name: gitleaks no perdona un secreto por estar en un workflow
        # La allowlist perdona los valores de prueba exactos, no los archivos donde viven. Un
        # token inventado aquí mismo, con forma de token de GitHub, tiene que detectarse.
        run: |
          mkdir -p /tmp/fuga/.github/workflows
          TOKEN="ghp_$(head -c 512 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'env:\n  TOKEN: %s\n' "$TOKEN" > /tmp/fuga/.github/workflows/fuga.yml
          if ./gitleaks detect --no-git --source /tmp/fuga -c .gitleaks.toml --no-banner --redact; then
            echo "FALLO: gitleaks no detectó un token en un workflow"; exit 1
          fi
          echo "OK: un secreto en un workflow se detecta"

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: SAST (bandit, severidad media+, bloqueante)
        # Versión fijada: un job que exige --require-hashes al resto de las dependencias
        # no debería instalar sus propias herramientas desde la última versión que haya
        # ese día (S-33). Fijarla hace además reproducible el resultado del SAST.
        run: |
          python -m pip install "pip==26.3"
          python -m pip install "bandit==1.9.4"
          bandit -r backend/apps backend/config -ll

      - name: Revisión de dependencias del PR (informativo)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@v5

  # El camino de producción tal como se despliega: la imagen prod y el compose de producción,
  # con el entorno de ci/prod.env (DEBUG=0), que lleva COMPOSE_FILE como el .env del servidor.
  # Cubre lo que la suite (DEBUG=1) no ve: el release antes que web, worker y beat; los
  # healthchecks del compose; gunicorn con gunicorn.conf.py; Caddy delante, con sus cabeceras,
  # sus estáticos y sus medios; y /readyz/ con la base, el broker y el latido de las tareas.
  prod-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: El compose de producción se carga
        run: |
          cp ci/prod.env .env
          docker compose config -q

      - name: El Caddyfile es válido
        run: docker compose run --rm --no-deps proxy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Levantar producción con su compose
        run: |
          docker compose up -d --build
          sano() { [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q "$1")")" = healthy ]; }
          for i in $(seq 1 60); do
            sano web && sano worker && sano beat && break
            sleep 5
          done
          for servicio in web worker beat; do
            sano "$servicio" || { echo "FALLO: $servicio no pasó su healthcheck"; docker compose ps; exit 1; }
          done
          echo "OK: web, worker y beat pasan los healthchecks del compose"

          RELEASE=$(docker compose ps -aq release)
          [ "$(docker inspect -f '{{.State.ExitCode}}' "$RELEASE")" = "0" ] \
            || { echo "FALLO: el release no terminó bien"; exit 1; }
          FIN=$(docker inspect -f '{{.State.FinishedAt}}' "$RELEASE")
          INICIO=$(docker inspect -f '{{.State.StartedAt}}' "$(docker compose ps -q web)")
          [[ "$FIN" < "$INICIO" ]] \
            || { echo "FALLO: web arrancó ($INICIO) antes de que terminara el release ($FIN)"; exit 1; }
          echo "OK: el release migra antes de que arranque web"

          docker compose logs web | grep -q "Using worker: gthread" \
            || { echo "FALLO: gunicorn no arrancó con hilos (gunicorn.conf.py)"; exit 1; }
          echo "OK: gunicorn arranca con gunicorn.conf.py"

      - name: El sitio, a través de Caddy
        run: |
          P=http://127.0.0.1:8080
          curl -fsS "$P/healthz/" | grep -qx ok
          H=$(curl -fsS -D - -o /dev/null "$P/")
          for cabecera in Content-Security-Policy X-Frame-Options X-Content-Type-Options Permissions-Policy; do
            echo "$H" | grep -qi "^$cabecera:" || { echo "FALLO: / se sirve sin $cabecera"; exit 1; }
          done
          echo "OK: / con las cabeceras de seguridad (DEBUG=0)"
          CSS=$(docker compose exec -T web python -c "import json; print(json.load(open('/app/staticfiles/staticfiles.json'))['paths']['css/site.css'])")
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$P/static/$CSS")" = 200 ] \
            || { echo "FALLO: Caddy no sirve el estático hasheado"; exit 1; }
          echo "OK: Caddy sirve el estático hasheado"
          # /readyz/ exige el latido de las tareas: beat despacha la publicación programada
          # al minuto de arrancar y el worker la ejecuta. Se espera hasta tres minutos.
          listo() { curl -fsS "$P/readyz/" | python3 -c "import json,sys; sys.exit(json.load(sys.stdin)['status'] != 'ready')"; }
          for i in $(seq 1 36); do listo 2>/dev/null && break; sleep 5; done
          listo || { curl -s "$P/readyz/"; exit 1; }
          echo "OK: /readyz/ = ready (BD, broker, latido, migraciones, disco)"

      # Caddy sirve /media/ fuera de Django: ni SecurityMiddleware ni config.csp tocan esas
      # respuestas, y ninguna prueba de la suite las ve. Un archivo subible desde el panel no
      # puede ejecutarse como HTML ni JS en el origen del sitio.
      - name: Cabeceras defensivas de /media/
        run: |
          docker compose exec -T web sh -c "printf '<script>alert(document.domain)</script>' > /app/mediafiles/evil.html"
          H=$(curl -sS -D - -o /dev/null http://127.0.0.1:8080/media/evil.html)
          echo "$H"
          echo "$H" | grep -iq 'X-Content-Type-Options: *nosniff' \
            || { echo "FALLO: /media/ se sirve sin nosniff"; exit 1; }
          echo "$H" | grep -iq "Content-Security-Policy: *default-src 'none'; sandbox" \
            || { echo "FALLO: /media/ se sirve sin CSP de aislamiento"; exit 1; }
          echo "OK: /media/ se sirve con nosniff y CSP de aislamiento"

      - name: Lo despublicado deja de servirse
        run: |
          # Dos registros con audio: uno publicado y otro no.
          ARCHIVOS=$(docker compose exec -T web python -c "
          import os, django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings'); django.setup()
          from django.core.files.base import ContentFile
          from django.utils import timezone
          from apps.media.models import Recording
          for slug, publicado in (('publicado', True), ('despublicado', False)):
              r = Recording(slug=slug, title=slug, kind='audio', published=publicado, published_at=timezone.now())
              r.file.save('lectura.mp3', ContentFile(b'ID3' + b'0' * 4096), save=False)
              r.save()
              print(r.file_url(), r.file.name)" | tail -2)
          PUB_URL=$(echo "$ARCHIVOS" | sed -n 1p | cut -d' ' -f1)
          PUB_FILE=$(echo "$ARCHIVOS" | sed -n 1p | cut -d' ' -f2)
          DES_URL=$(echo "$ARCHIVOS" | sed -n 2p | cut -d' ' -f1)
          DES_FILE=$(echo "$ARCHIVOS" | sed -n 2p | cut -d' ' -f2)
          P=http://127.0.0.1:8080
          codigo() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          [ "$(codigo "$P$PUB_URL")" = 200 ] \
            || { echo "FALLO: el audio publicado no se sirve"; exit 1; }
          [ "$(codigo -H 'Range: bytes=0-9' "$P$PUB_URL")" = 206 ] \
            || { echo "FALLO: el audio publicado no admite saltos (Range)"; exit 1; }
          [ "$(codigo "$P$DES_URL")" = 404 ] \
            || { echo "FALLO: el audio despublicado se sigue sirviendo"; exit 1; }
          for archivo in "$PUB_FILE" "$DES_FILE"; do
            [ "$(codigo "$P/media/$archivo")" = 404 ] \
              || { echo "FALLO: /media/$archivo se sirve sin pasar por Django"; exit 1; }
          done
          curl -s "$P/feed/registros/" | grep -q "$PUB_URL" \
            || { echo "FALLO: el feed de pódcast no entrega el registro publicado"; exit 1; }
          echo "OK: lo publicado se sirve con Range, lo despublicado da 404 y /media/ no lo entrega"

      # Subidas desde el panel, con el Caddy de producción delante: el límite de /admin/ deja
      # llegar a Django lo que pasa del tope de un campo, para que se vea el mensaje del
      # formulario y no un 413 sin cuerpo; lo que pasa del límite lo corta Caddy.
      - name: Subidas por el panel, a través de Caddy
        run: |
          # Una sesión de administración creada en la base: lo que se prueba es la subida.
          SESSION=$(docker compose exec -T web python -c "
          import os, django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings'); django.setup()
          from django.contrib.auth import BACKEND_SESSION_KEY, HASH_SESSION_KEY, SESSION_KEY, get_user_model
          from django.contrib.sessions.backends.db import SessionStore
          u = get_user_model().objects.create_superuser('ci-panel', 'ci@example.com', 'ci-panel-clave-larga')
          s = SessionStore()
          s[SESSION_KEY] = str(u.pk)
          s[BACKEND_SESSION_KEY] = 'django.contrib.auth.backends.ModelBackend'
          s[HASH_SESSION_KEY] = u.get_session_auth_hash()
          s.create()
          print(s.session_key)" | tail -1)
          CSRF=abcdefghijklmnopqrstuvwxyz012345
          sube() {
            curl -s -o "/tmp/subida-$1.html" -w '%{http_code}' \
              -b "sessionid=$SESSION; csrftoken=$CSRF" -F csrfmiddlewaretoken=$CSRF \
              -F title="Lectura $1" -F slug="lectura-$1" -F kind=audio -F position=0 \
              -F "file=@/tmp/audio-$1.mp3;type=audio/mpeg" \
              http://127.0.0.1:8080/admin/media/recording/add/ || true
          }
          for megas in 40 55 70; do head -c "${megas}000000" /dev/zero > "/tmp/audio-$megas.mp3"; done
          [ "$(sube 40)" = 302 ] || { echo "FALLO: el audio de 40 MB no se guardó"; exit 1; }
          [ "$(sube 55)" = 200 ] && grep -q "el máximo es 50 MB" /tmp/subida-55.html \
            || { echo "FALLO: el audio de 55 MB no dio el error del formulario"; exit 1; }
          sube 70 > /dev/null
          docker compose exec -T web python -c "
          import os, django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings'); django.setup()
          from apps.media.models import Recording
          subidos = Recording.objects.filter(slug__startswith='lectura-').values_list('slug', flat=True)
          assert sorted(subidos) == ['lectura-40'], 'Caddy no cortó el cuerpo de 70 MB'"
          echo "OK: el panel guarda 40 MB, explica los 55 MB y Caddy corta los 70 MB"

      - name: Si el release falla, no arranca nada
        run: |
          # Una tabla que ya existe hace fallar la migración inicial de content.
          docker compose down -v
          docker compose up -d --wait db
          docker compose exec -T db psql -U resenas -d resenas -qc "CREATE TABLE content_article (id int);"
          if docker compose up -d --no-build web worker beat; then
            echo "FALLO: compose arrancó los servicios con el release fallido"; exit 1
          fi
          ARRANCADOS=$(docker compose ps --status running --services | grep -c -E '^(web|worker|beat)$' || true)
          [ "$ARRANCADOS" = "0" ] \
            || { echo "FALLO: arrancaron $ARRANCADOS servicios con el release fallido"; exit 1; }
          echo "OK: si el release falla, web, worker y beat no arrancan"

      - name: Registro de producción, si algo falló
        if: failure()
        run: docker compose logs --no-color --tail 200 release web worker beat proxy

  # Verifica la recuperación ante desastre (DR): que un respaldo pg_dump del esquema
  # REAL (con triggers FTS, extensión unaccent y datos de migración) se pueda restaurar
  # íntegro. Ni backup.sh ni restore.sh se ejercitaban en ningún test/CI.
  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construir imagen de producción
        run: docker build --target prod -t resenas-prod ./backend

      - name: Roundtrip de respaldo/restauración (pg_dump → pg_restore)
        run: |
          # La imagen de la base del compose, fijada por digest: la misma que la del sidecar de
          # respaldos (tests/test_image_pinning.py). Sirve también para leer los artefactos.
          touch .env
          PG_IMAGE=$(docker compose -f docker-compose.yml config --format json | jq -r .services.db.image)
          echo "imagen de la base: $PG_IMAGE"
          docker network create bknet
          docker run -d --name bk-db --network bknet \
            -e POSTGRES_DB=resenas -e POSTGRES_USER=resenas \
            -e POSTGRES_PASSWORD=ci-strong-db-password "$PG_IMAGE"
          for i in $(seq 1 30); do
            docker exec bk-db pg_isready -U resenas >/dev/null 2>&1 && break
            sleep 2
          done
          # Migra el esquema REAL con la imagen prod (triggers FTS, extensión unaccent,
          # páginas legales de migración).
          docker run --rm --network bknet \
            -e DJANGO_DEBUG=0 \
            -e DJANGO_SECRET_KEY=ci-prod-secret-Kx7mQ9vLpZ4wR8nT3bY6cF1jH5dG0sA2eU7oI4aN9qW \
            -e POSTGRES_HOST=bk-db -e POSTGRES_DB=resenas -e POSTGRES_USER=resenas \
            -e POSTGRES_PASSWORD=ci-strong-db-password \
            -e REDIS_PASSWORD=ci-strong-redis-password \
            -e DJANGO_ALLOWED_HOSTS=localhost -e DJANGO_CSRF_TRUSTED_ORIGINS=https://localhost \
            -e SITE_URL=https://localhost \
            -e DJANGO_ALLOW_WEAKENED=SENTRY_DSN \
            -e DEFAULT_FROM_EMAIL=no-reply@ci.example.com \
            --entrypoint python resenas-prod manage.py migrate
          PG="docker exec -e PGPASSWORD=ci-strong-db-password bk-db"
          ORIG=$($PG psql -U resenas -d resenas -tAc "SELECT count(*) FROM content_page;")
          # Respaldo: pg_dump --format=custom (igual que backup.sh).
          $PG pg_dump -U resenas -d resenas --format=custom --file=/tmp/db.dump
          # Restauración en BD limpia con los flags de restore.sh.
          $PG psql -U resenas -d postgres -qc "CREATE DATABASE restored;"
          $PG pg_restore -U resenas -d restored --clean --if-exists --no-owner --no-acl /tmp/db.dump
          REST=$($PG psql -U resenas -d restored -tAc "SELECT count(*) FROM content_page;")
          TRG=$($PG psql -U resenas -d restored -tAc "SELECT count(*) FROM pg_trigger WHERE tgname LIKE '%search_vector_trg';")
          EXT=$($PG psql -U resenas -d restored -tAc "SELECT count(*) FROM pg_extension WHERE extname='unaccent';")
          echo "content_page orig=$ORIG restaurado=$REST | triggers FTS=$TRG | unaccent=$EXT"
          # Comprobaciones explícitas: con `set -e`, en `test A && test B` el fallo de A no
          # aborta el paso, y la comprobación nunca podía fallar.
          [ "$ORIG" = "$REST" ] && [ "$ORIG" -gt 0 ] && [ "$TRG" = "2" ] && [ "$EXT" = "1" ] \
            || { echo "FALLO: la restauración no coincide con el original"; exit 1; }
          echo "OK: respaldo restaurado íntegro (datos + triggers FTS + extensión)"

          # ── backup.sh REAL, con la imagen del sidecar (trae curl para el ping) ──
          # Los artefactos llevan la BD completa y los manuscritos privados: deben quedar
          # cerrados. Un receptor de pings registra cada aviso de éxito o de fallo.
          docker build -q -t resenas-backup ./infra/backup >/dev/null
          docker run -d --name bk-ping --network bknet --entrypoint python resenas-prod \
            -m http.server 8000 >/dev/null
          for i in $(seq 1 30); do
            docker exec bk-ping python -c "import urllib.request as u; u.urlopen('http://localhost:8000/')" 2>/dev/null && break
            sleep 1
          done
          BK="docker run --rm --network bknet -e POSTGRES_HOST=bk-db -e POSTGRES_DB=resenas
            -e POSTGRES_USER=resenas -e POSTGRES_PASSWORD=ci-strong-db-password
            -e BACKUP_PING_URL=http://bk-ping:8000/ping -v $PWD/infra/backup:/scripts:ro
            --entrypoint sh"
          mkdir -p /tmp/bk /tmp/bkmedia /tmp/bkpriv /tmp/vacio /tmp/bkgrande
          echo "foto" > /tmp/bkmedia/foto.jpg
          echo "manuscrito" > /tmp/bkpriv/privado.txt
          $BK -v /tmp/bk:/backups -v /tmp/bkmedia:/volumes/media \
            -v /tmp/bkpriv:/volumes/private_media resenas-backup /scripts/backup.sh

          # Los artefactos los crea root dentro del contenedor: se leen desde otro
          # contenedor en vez de con sudo (portable y sin depender del runner).
          docker run --rm -v /tmp/bk:/backups "$PG_IMAGE" sh -c '
            set -eu
            D=$(find /backups -name db.dump | head -1)
            test -n "$D" || { echo "FALLO: backup.sh no generó el dump"; exit 1; }
            DIR=$(dirname "$D")
            echo "permisos → dir=$(stat -c %a "$DIR") dump=$(stat -c %a "$D") priv=$(stat -c %a "$DIR/private_media.tar.gz")"
            test "$(stat -c %a "$DIR")" = "700" || { echo "FALLO: el directorio no es 700"; exit 1; }
            test "$(stat -c %a "$D")" = "600" || { echo "FALLO: el dump no es 600"; exit 1; }
            test "$(stat -c %a "$DIR/private_media.tar.gz")" = "600" || { echo "FALLO: el tar privado no es 600"; exit 1; }
            test -f "$DIR/OK" || { echo "FALLO: el respaldo completo no tiene OK"; exit 1; }
          '
          echo "OK: los respaldos no son legibles por otros usuarios del host y llevan OK"

          # ── Un respaldo que no se pudo hacer entero falla en voz alta ──
          # Medios sin montar (un volumen vacío), un volumen que no es un directorio y un
          # destino donde cabe el dump pero no el tar de los medios.
          touch /tmp/no-es-dir
          head -c 4000000 /dev/urandom > /tmp/bkgrande/grande.bin
          for caso in "vacio:-v /tmp/vacio:/volumes/media -v /tmp/bk:/backups" \
                      "no-es-dir:-v /tmp/no-es-dir:/volumes/media -v /tmp/bk:/backups" \
                      "sin-espacio:-v /tmp/bkgrande:/volumes/media --tmpfs /backups:size=2m"; do
            if $BK ${caso#*:} -v /tmp/bkpriv:/volumes/private_media resenas-backup /scripts/backup.sh; then
              echo "FALLO: backup.sh dio por bueno el caso ${caso%%:*}"; exit 1
            fi
            echo "OK: el caso ${caso%%:*} hace fallar el respaldo"
          done
          EXITOS=$(docker logs bk-ping 2>&1 | grep -c 'GET /ping HTTP' || true)
          FALLOS=$(docker logs bk-ping 2>&1 | grep -c 'GET /ping/fail' || true)
          echo "pings → éxito=$EXITOS fallo=$FALLOS"
          [ "$EXITOS" = "1" ] && [ "$FALLOS" = "3" ] \
            || { echo "FALLO: se esperaba 1 aviso de éxito y 3 de fallo"; exit 1; }
          docker run --rm -v /tmp/bk:/backups "$PG_IMAGE" sh -c \
            'test "$(find /backups -name OK | wc -l)" = "1"' \
            || { echo "FALLO: un respaldo fallido quedó como completo"; exit 1; }
          echo "OK: cada fallo avisa, y ninguno queda como respaldo completo"

          # ── restore.sh exige confirmación explícita ──
          RESTORE="docker run --rm --network bknet -e POSTGRES_HOST=bk-db -e POSTGRES_DB=resenas
            -e POSTGRES_USER=resenas -e POSTGRES_PASSWORD=ci-strong-db-password
            -v $PWD/infra/backup:/scripts:ro -v /tmp/bk:/backups
            -v /tmp/bkmedia:/volumes/media -v /tmp/bkpriv:/volumes/private_media"
          if $RESTORE "$PG_IMAGE" sh /scripts/restore.sh latest; then
            echo "FALLO: restore.sh se ejecutó sin confirmación"; exit 1
          fi
          echo "OK: restore.sh se niega a destruir sin RESTORE_CONFIRM"

          # ── restore.sh latest elige el respaldo completo más reciente ──
          # Un directorio más nuevo pero sin OK (a medias) no se restaura nunca.
          docker run --rm -v /tmp/bk:/backups "$PG_IMAGE" sh -c \
            'D=$(dirname "$(find /backups -name OK | head -1)"); mkdir /backups/20991231-235959 && cp "$D/db.dump" /backups/20991231-235959/'
          SALIDA=$($RESTORE -e RESTORE_CONFIRM=SI-DESTRUIR-resenas "$PG_IMAGE" sh /scripts/restore.sh latest)
          echo "$SALIDA"
          if echo "$SALIDA" | grep -q "20991231-235959"; then
            echo "FALLO: restore.sh latest eligió un respaldo a medias"; exit 1
          fi
          echo "$SALIDA" | grep -q "✓ restauración completa"
          echo "OK: restore.sh latest restaura el último respaldo completo"

          # ── Off-site: respaldo a un repositorio restic y restauración desde él ──
          # Lo que cambia después del respaldo (los títulos y un archivo) vuelve al restaurar.
          mkdir -p /tmp/restic
          RESTIC_ENV="-e RESTIC_REPOSITORY=/restic -e RESTIC_PASSWORD=ci-restic-password
            -v /tmp/restic:/restic"
          CAMBIADAS="SELECT count(*) FROM content_page WHERE title = 'cambiado';"
          $BK $RESTIC_ENV -v /tmp/bk:/backups -v /tmp/bkmedia:/volumes/media \
            -v /tmp/bkpriv:/volumes/private_media resenas-backup /scripts/backup.sh
          $PG psql -U resenas -d resenas -qc "UPDATE content_page SET title = 'cambiado';"
          docker run --rm -v /tmp/bkmedia:/m "$PG_IMAGE" rm /m/foto.jpg
          $RESTORE $RESTIC_ENV -e RESTORE_CONFIRM=SI-DESTRUIR-resenas --entrypoint sh \
            resenas-backup /scripts/restore.sh --from-restic latest
          [ "$($PG psql -U resenas -d resenas -tAc "$CAMBIADAS")" = "0" ] \
            || { echo "FALLO: restic no devolvió la base del respaldo"; exit 1; }
          docker run --rm -v /tmp/bkmedia:/m "$PG_IMAGE" test -f /m/foto.jpg \
            || { echo "FALLO: restic no devolvió el archivo de medios"; exit 1; }
          echo "OK: la base y los medios vuelven desde restic"

          # La retención agrupa las instantáneas y poda: con un solo diario por política, dos
          # respaldos dejan una (si cada instantánea formara su propio grupo, quedarían las dos).
          $BK $RESTIC_ENV -e RESTIC_KEEP_DAILY=1 -e RESTIC_KEEP_WEEKLY=0 -e RESTIC_KEEP_MONTHLY=0 \
            -v /tmp/bk:/backups -v /tmp/bkmedia:/volumes/media \
            -v /tmp/bkpriv:/volumes/private_media resenas-backup /scripts/backup.sh
          INSTANTANEAS=$(docker run --rm $RESTIC_ENV --entrypoint restic resenas-backup \
            snapshots --json | grep -o '"short_id"' | wc -l)
          [ "$INSTANTANEAS" = "1" ] \
            || { echo "FALLO: la retención de restic dejó $INSTANTANEAS instantáneas"; exit 1; }
          echo "OK: la retención de restic agrupa y poda"

          # ── Un fallo a mitad deja la base y los medios como estaban ──
          # Una vista que depende de content_page hace fallar el DROP de pg_restore a mitad.
          $PG psql -U resenas -d resenas -qc "UPDATE content_page SET title = 'cambiado';"
          $PG psql -U resenas -d resenas -qc "CREATE VIEW bloqueo AS SELECT * FROM content_page;"
          docker run --rm -v /tmp/bkmedia:/m "$PG_IMAGE" sh -c 'echo marca > /m/marca.txt'
          if $RESTORE -e RESTORE_CONFIRM=SI-DESTRUIR-resenas "$PG_IMAGE" sh /scripts/restore.sh latest; then
            echo "FALLO: la restauración debía fallar a mitad"; exit 1
          fi
          [ "$($PG psql -U resenas -d resenas -tAc "$CAMBIADAS")" = "$ORIG" ] \
            || { echo "FALLO: la base no quedó como estaba"; exit 1; }
          docker run --rm -v /tmp/bkmedia:/m "$PG_IMAGE" sh -c 'test -f /m/marca.txt && test ! -e /m/.restaurando' \
            || { echo "FALLO: los medios no quedaron como estaban"; exit 1; }
          $PG psql -U resenas -d resenas -qc "DROP VIEW bloqueo;"
          echo "OK: un fallo a mitad deja la base y los medios como estaban"

          # ── --media-only no toca la base ──
          docker run --rm -v /tmp/bkmedia:/m "$PG_IMAGE" rm /m/foto.jpg
          $RESTORE -e RESTORE_CONFIRM=SI-DESTRUIR-resenas "$PG_IMAGE" \
            sh /scripts/restore.sh --media-only latest
          [ "$($PG psql -U resenas -d resenas -tAc "$CAMBIADAS")" = "$ORIG" ] \
            || { echo "FALLO: --media-only tocó la base"; exit 1; }
          docker run --rm -v /tmp/bkmedia:/m "$PG_IMAGE" sh -c 'test -f /m/foto.jpg && test ! -e /m/marca.txt' \
            || { echo "FALLO: --media-only no restauró los medios"; exit 1; }
          echo "OK: --media-only restaura los medios y deja la base"

          docker rm -f bk-ping >/dev/null
          docker rm -f bk-db >/dev/null && docker network rm bknet >/dev/null
