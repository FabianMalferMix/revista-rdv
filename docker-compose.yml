name: resenas

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resenas}
      POSTGRES_USER: ${POSTGRES_USER:-resenas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resenas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resenas}"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      # Solo localhost del host: nunca expuesto a Internet (tampoco en prod).
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Aplica migraciones + grupos (entrypoint) y levanta el servidor de desarrollo.
  web:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes:
      - ./backend:/app
      - media:/app/mediafiles
      - private_media:/app/private_media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Worker de Celery (envío de correo, publicación programada). Sin migraciones: las corre `web`.
  worker:
    build: ./backend
    entrypoint: ["celery", "-A", "config", "worker", "-l", "info"]
    env_file: .env
    volumes:
      - ./backend:/app
      - media:/app/mediafiles
      - private_media:/app/private_media
    depends_on:
      - web

  # Planificador de Celery (dispara publish_due_articles cada minuto).
  beat:
    build: ./backend
    entrypoint: ["celery", "-A", "config", "beat", "-l", "info"]
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - web

  # Respaldos (perfil "backup"): NO arranca con `docker compose up`.
  #  · Respaldo puntual:   docker compose run --rm --entrypoint sh backup /scripts/backup.sh
  #  · Restaurar:          docker compose run --rm --entrypoint sh backup /scripts/restore.sh latest
  #  · Sidecar programado (prod): docker compose --profile backup up -d backup
  # /backups es un bind-mount del host (BACKUP_DIR) para sobrevivir a `down -v` y a la
  # pérdida del disco; apúntalo a almacenamiento respaldado/externo en producción.
  backup:
    image: postgres:16
    profiles: ["backup"]
    env_file: .env
    volumes:
      - media:/volumes/media
      - private_media:/volumes/private_media
      - ${BACKUP_DIR:-./backups}:/backups
      - ./infra/backup:/scripts:ro
    entrypoint: ["sh", "/scripts/entrypoint.sh"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
  private_media:
  redisdata:
