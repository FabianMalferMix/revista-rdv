name: resenas

# Base "prod-safe": los servicios usan el código de la IMAGEN (sin bind-mount).
# En desarrollo, docker-compose.override.yml (auto-cargado) añade el montaje de código,
# runserver y el puerto local. En producción se usa docker-compose.prod.yml.

services:
  db:
    image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resenas}
      POSTGRES_USER: ${POSTGRES_USER:-resenas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resenas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resenas}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    # noeviction: como broker de Celery, Redis NUNCA debe descartar tareas encoladas
    # bajo presión de memoria (rechaza escrituras en su lugar). No se usa como caché.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # App. Sin command → usa el CMD (gunicorn) de la imagen. El entrypoint migra + siembra
  # grupos salvo DJANGO_SKIP_MIGRATE=1 (producción los corre como paso de despliegue).
  web:
    build: ./backend
    env_file: .env
    volumes:
      - media:/app/mediafiles
      - private_media:/app/private_media
      # Los estáticos ya recolectados se comparten con el proxy, que los sirve en el
      # borde en vez de hacerlos atravesar los workers de gunicorn (hallazgo S-27).
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Worker de Celery (correo, publicación programada).
  worker:
    build: ./backend
    entrypoint: ["celery", "-A", "config", "worker", "-l", "info"]
    env_file: .env
    volumes:
      - media:/app/mediafiles
      - private_media:/app/private_media
    depends_on:
      - web

  # Planificador de Celery (dispara publish_due_articles cada minuto).
  beat:
    build: ./backend
    entrypoint: ["celery", "-A", "config", "beat", "-l", "info"]
    env_file: .env
    depends_on:
      - web

  # Respaldos (perfil "backup"): NO arranca con `docker compose up`.
  #  · Respaldo puntual:   docker compose run --rm --entrypoint sh backup /scripts/backup.sh
  #  · Restaurar:          docker compose run --rm --entrypoint sh backup /scripts/restore.sh latest
  #  · Sidecar programado (prod): docker compose --profile backup up -d backup
  # /backups es un bind-mount del host (BACKUP_DIR) para sobrevivir a `down -v` y a la
  # pérdida del disco; apúntalo a almacenamiento respaldado/externo en producción.
  backup:
    build: ./infra/backup   # postgres:16 + restic (off-site) + curl (alertas)
    profiles: ["backup"]
    # Entorno EXPLÍCITO en vez de `env_file: .env` (mínimo privilegio): antes recibía el
    # fichero completo, incluida DJANGO_SECRET_KEY y las credenciales de SMTP, que no
    # necesita para nada. Ojo al enumerar: RESTIC_PASSWORD y AWS_* no aparecen en los
    # scripts porque los lee el propio binario `restic`, no el shell.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resenas}
      POSTGRES_USER: ${POSTGRES_USER:-resenas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resenas}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      RESTIC_HOST: ${RESTIC_HOST:-resenas}
      RESTIC_KEEP: ${RESTIC_KEEP:-30}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      RESTORE_CONFIRM: ${RESTORE_CONFIRM:-}
    volumes:
      - media:/volumes/media
      - private_media:/volumes/private_media
      - ${BACKUP_DIR:-./backups}:/backups
      - ./infra/backup:/scripts:ro
    entrypoint: ["sh", "/scripts/entrypoint.sh"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
  private_media:
  staticfiles:
  redisdata:
