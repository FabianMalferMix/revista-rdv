name: resenas

# Base "prod-safe": los servicios usan el código de la IMAGEN (sin bind-mount).
# En desarrollo, docker-compose.override.yml (auto-cargado) añade el montaje de código,
# runserver y el puerto local. En producción se usa docker-compose.prod.yml.

services:
  db:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resenas}
      POSTGRES_USER: ${POSTGRES_USER:-resenas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resenas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resenas}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # noeviction: como broker de Celery, Redis NUNCA debe descartar tareas encoladas
    # bajo presión de memoria (rechaza escrituras en su lugar). En producción guarda
    # también la caché de Django, en la base 2 (CACHES, en settings.py).
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Paso de despliegue (backend/release.sh): migra, sincroniza los grupos y recoge los
  # estáticos, una vez y antes de que arranquen web, worker y beat, que esperan a que termine
  # bien. Si falla, no arranca nada con el código nuevo.
  release:
    build: ./backend
    command: ["sh", "release.sh"]
    env_file: .env
    volumes:
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # App. Sin command → usa el CMD (gunicorn) de la imagen.
  web:
    build: ./backend
    env_file: .env
    volumes:
      - media:/app/mediafiles
      - private_media:/app/private_media
      # Los estáticos ya recolectados se comparten con el proxy, que los sirve en el
      # borde en vez de hacerlos atravesar los workers de gunicorn (hallazgo S-27).
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      release:
        condition: service_completed_successfully

  # Worker de Celery (correo, publicación programada).
  worker:
    build: ./backend
    entrypoint: ["celery", "-A", "config", "worker", "-l", "info"]
    env_file: .env
    volumes:
      - media:/app/mediafiles
      - private_media:/app/private_media
    depends_on:
      redis:
        condition: service_healthy
      release:
        condition: service_completed_successfully

  # Planificador de Celery: dispara las tareas de CELERY_BEAT_SCHEDULE (settings.py).
  beat:
    build: ./backend
    entrypoint: ["celery", "-A", "config", "beat", "-l", "info"]
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      release:
        condition: service_completed_successfully

  # Respaldos (perfil "backup"): NO arranca con `docker compose up`.
  #  · Respaldo puntual:   docker compose run --rm --entrypoint sh backup /scripts/backup.sh
  #  · Restaurar:          docker compose run --rm --entrypoint sh backup /scripts/restore.sh latest
  #  · Sidecar programado (prod): docker compose --profile backup up -d backup
  # /backups es un bind-mount del host (BACKUP_DIR) para sobrevivir a `down -v` y a la
  # pérdida del disco; apúntalo a almacenamiento respaldado/externo en producción.
  backup:
    build: ./infra/backup   # postgres:16 + restic (off-site) + curl (alertas)
    profiles: ["backup"]
    # Entorno EXPLÍCITO en vez de `env_file: .env` (mínimo privilegio): antes recibía el
    # fichero completo, incluida DJANGO_SECRET_KEY y las credenciales de SMTP, que no
    # necesita para nada. Ojo al enumerar: RESTIC_PASSWORD y AWS_* no aparecen en los
    # scripts porque los lee el propio binario `restic`, no el shell.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resenas}
      POSTGRES_USER: ${POSTGRES_USER:-resenas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resenas}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_MIN_MEDIA_FILES: ${BACKUP_MIN_MEDIA_FILES:-1}
      BACKUP_MIN_PRIVATE_FILES: ${BACKUP_MIN_PRIVATE_FILES:-0}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      RESTIC_HOST: ${RESTIC_HOST:-resenas}
      RESTIC_KEEP_DAILY: ${RESTIC_KEEP_DAILY:-7}
      RESTIC_KEEP_WEEKLY: ${RESTIC_KEEP_WEEKLY:-5}
      RESTIC_KEEP_MONTHLY: ${RESTIC_KEEP_MONTHLY:-12}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      RESTORE_CONFIRM: ${RESTORE_CONFIRM:-}
    volumes:
      - media:/volumes/media
      - private_media:/volumes/private_media
      - ${BACKUP_DIR:-./backups}:/backups
      - ./infra/backup:/scripts:ro
    entrypoint: ["sh", "/scripts/entrypoint.sh"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
  private_media:
  staticfiles:
  redisdata:
