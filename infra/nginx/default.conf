# Proxy inverso para producción. En desarrollo se usa runserver directamente.
# Para activarlo, añade un servicio `proxy` (nginx) al compose montando este archivo
# y sirviendo los volúmenes de estáticos/medios.

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/mediafiles/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
