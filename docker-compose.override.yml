# Override de DESARROLLO — lo carga `docker compose up` automáticamente.
# Monta el código para hot-reload, usa runserver y publica el puerto local (solo 127.0.0.1).
# En producción NO se carga (se usa `-f docker-compose.yml -f docker-compose.prod.yml`).

services:
  web:
    build:
      context: ./backend
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    # runserver atiende cada petición en un hilo nuevo, y con conexiones persistentes cada
    # hilo dejaba la suya abierta: unos cientos de páginas seguidas llenaban las 100 de
    # Postgres y el sitio respondía 500 («too many clients already»). La documentación de
    # Django pide no usarlas con el servidor de desarrollo.
    environment:
      DJANGO_CONN_MAX_AGE: "0"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"

  # El release migra con el código montado y no recoge estáticos: runserver los sirve desde las
  # apps. Corre en cada `docker compose up`, antes que web, worker y beat.
  release:
    build:
      context: ./backend
      target: dev
    environment:
      RELEASE_COLLECTSTATIC: "0"
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app

  beat:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app

  # Puerto de la BD publicado solo en dev (psql/GUI local, en 127.0.0.1).
  # En producción la BD no se publica: solo se accede por la red interna de compose.
  db:
    ports:
      - "127.0.0.1:5432:5432"
