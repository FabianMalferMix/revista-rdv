[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["staticfiles", "**/migrations/*"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, C4 comprehensions.
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]  # el largo de línea lo gestiona el formateador

# ── Cobertura (pytest-cov) ────────────────────────────────
[tool.coverage.run]
source = ["apps", "config"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
    "*/apps.py",
    # Arranque/config triviales y el storage de estáticos: no se ejercitan en pytest
    # (corre con DEBUG=1 → storage simple). config/staticfiles.py (el manifiesto de
    # prod) se valida en CI, job build-prod: collectstatic con DEBUG=0 sobre la imagen
    # de producción, afirmando hash de estáticos propios y exención de vendor/tinymce/.
    "config/settings.py",
    "config/wsgi.py",
    "config/asgi.py",
    "config/urls.py",
    "config/staticfiles.py",
]

[tool.coverage.report]
# Líneas que no cuentan como sin-cubrir (ramas defensivas, stubs, etc.).
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "def __str__",
    "def __repr__",
]
