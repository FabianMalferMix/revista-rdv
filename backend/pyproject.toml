[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["staticfiles", "**/migrations/*"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, C4 comprehensions.
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]  # el largo de línea lo gestiona el formateador

# ── Cobertura (pytest-cov) ────────────────────────────────
[tool.coverage.run]
source = ["apps", "config"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
    "*/apps.py",
    # Arranque/config triviales y el storage de estáticos: no se ejercitan en pytest
    # (corre con DEBUG=1 → storage simple). config/staticfiles.py (el manifiesto de
    # prod) se valida en CI, job build-prod: collectstatic con DEBUG=0 sobre la imagen
    # de producción, afirmando hash de estáticos propios y exención de vendor/tinymce/.
    "config/settings.py",
    "config/wsgi.py",
    "config/asgi.py",
    "config/urls.py",
    "config/staticfiles.py",
]

[tool.coverage.report]
# Líneas que no cuentan como sin-cubrir (ramas defensivas, stubs, etc.).
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "def __str__",
    "def __repr__",
]

# ── Las aristas entre apps (import-linter) ────────────────
# `lint-imports`, desde backend/, falla ante un import nuevo entre dos apps que hoy no se importan:
# las aristas de hoy son la lista de ignore_imports, una por cada app que importa a otra. Cuenta
# los imports de Python, también los que van dentro de una función; no ve las relaciones entre
# modelos por nombre ("agenda.Event") ni los reverse() hacia otra app. Una arista que ya no existe
# también lo hace fallar, para que su línea se borre.
[tool.importlinter]
root_packages = ["apps"]

[[tool.importlinter.contracts]]
name = "Las apps solo se importan por las aristas de hoy"
type = "independence"
modules = ["apps.*"]
ignore_imports = [
    "apps.agenda.** -> apps.showcase.**",
    "apps.agenda.** -> apps.site.**",
    "apps.community.** -> apps.showcase.**",
    "apps.content.** -> apps.people.**",
    "apps.content.** -> apps.reviews.**",
    "apps.content.** -> apps.showcase.**",
    "apps.content.** -> apps.site.**",
    "apps.devtools.** -> apps.agenda.**",
    "apps.devtools.** -> apps.content.**",
    "apps.devtools.** -> apps.media.**",
    "apps.devtools.** -> apps.people.**",
    "apps.devtools.** -> apps.reviews.**",
    "apps.devtools.** -> apps.showcase.**",
    "apps.devtools.** -> apps.site.**",
    "apps.media.** -> apps.content.**",
    "apps.media.** -> apps.showcase.**",
    "apps.media.** -> apps.site.**",
    "apps.people.** -> apps.content.**",
    "apps.people.** -> apps.site.**",
    "apps.reviews.** -> apps.content.**",
    "apps.reviews.** -> apps.showcase.**",
    "apps.showcase.** -> apps.agenda.**",
    "apps.showcase.** -> apps.content.**",
    "apps.showcase.** -> apps.media.**",
    "apps.showcase.** -> apps.people.**",
    "apps.showcase.** -> apps.site.**",
    "apps.site.** -> apps.agenda.**",
    "apps.site.** -> apps.content.**",
    "apps.site.** -> apps.media.**",
    "apps.site.** -> apps.people.**",
    "apps.site.** -> apps.reviews.**",
    "apps.site.** -> apps.showcase.**",
    "apps.site.** -> apps.submissions.**",
    "apps.submissions.** -> apps.community.**",
]
broken_contract_guidance = """\
Un import nuevo entre dos apps que no se importaban. Lo que usan varias apps va en apps/site/ o \
en config/; si la arista hace falta de verdad, se añade a ignore_imports en \
backend/pyproject.toml."""
