{% load images %}
<li class="pub-card">
  <a href="{{ pub.get_absolute_url }}">
    {% if pub.cover %}{% responsive_img pub.cover sizes="(max-width: 600px) 45vw, 240px" %}{% else %}<span class="pub-cover-fallback" aria-hidden="true"><span>{{ pub.title }}</span></span>{% endif %}
    <span class="pub-title">{{ pub.title }}</span>
  </a>
  <span class="muted">{{ pub.get_kind_display }}{% if pub.year %} · {{ pub.year }}{% endif %}{% if pub.publisher %} · {{ pub.publisher.name }}{% endif %}</span>
</li>
