{% if q %}
  {% if results %}
    <ul class="search-list">
      {% for r in results %}
        <li>
          <a href="{{ r.url }}">{{ r.title }}</a>
          <span class="kicker">{{ r.kind }}</span>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="empty">Sin resultados para “{{ q }}”.</p>
  {% endif %}
{% endif %}
