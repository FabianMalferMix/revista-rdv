[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests
pythonpath = .
addopts = -q --reuse-db
; Tras cambiar modelos/migraciones, recrear la BD de test: pytest --create-db
; Los warnings son errores: obliga a atender deprecations (p. ej. de cara a
; Django 6.x) en vez de dejarlas pasar en silencio.
filterwarnings =
    error
    ; WhiteNoise avisa si STATIC_ROOT no existe (en tests no se corre collectstatic).
    ; Es benigno aquí —los estáticos no se sirven en tests; el camino real se valida
    ; en el job prod-runtime del CI— y no debe convertir la suite en roja.
    ignore:No directory at:UserWarning
    ; FORMS_URLFIELD_ASSUME_HTTPS es una opción TRANSITORIA: existe para adoptar hoy el
    ; comportamiento de Django 6 (asumir https en una URL sin protocolo) y la propia
    ; Django avisa de que desaparecerá al llegar esa versión. Sin activarla, construir
    ; cualquier formulario con un URLField —hay 9 en el proyecto— dispara el otro
    ; RemovedInDjango60Warning y deja la suite roja. AL SUBIR A DJANGO 6: quitar la
    ; opción de settings.py Y este ignore, juntos.
    ignore:The FORMS_URLFIELD_ASSUME_HTTPS transitional setting is deprecated
markers =
    integration: no hermetico — requiere infraestructura real (Redis/broker) o transacciones concurrentes reales (transaction=True + hilos)
; pytest-randomly aleatoriza el orden en cada corrida (detecta dependencias de
; orden); pytest-xdist permite paralelizar con -n auto.
