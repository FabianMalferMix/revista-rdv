# Override de PRODUCCIÓN. No carga docker-compose.override.yml → usa el código de la imagen.
#
#   cp .env.prod.example .env   &&   editar .env (SECRET_KEY, contraseñas, SITE_ADDRESS…)
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   # migraciones y grupos, como paso de despliegue (web no los corre al arrancar):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --entrypoint python web manage.py migrate
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --entrypoint python web manage.py setup_groups
#
# Caddy (proxy) termina TLS automáticamente (Let's Encrypt) cuando SITE_ADDRESS es un dominio.
# Ver docs/despliegue.md.

services:
  web:
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - ${GUNICORN_WORKERS:-3}
      # Con hilos, gunicorn usa la clase gthread en vez de sync: una petición lenta ya
      # no bloquea un proceso entero, así que el paralelismo efectivo pasa de 3 a 12
      # (hallazgo S-07). Los timeouts del borde están en infra/caddy/Caddyfile.
      - --threads
      - ${GUNICORN_THREADS:-4}
      - --timeout
      - "30"
      - --graceful-timeout
      - "30"
      - --max-requests
      - "1000"
      - --max-requests-jitter
      - "100"
      - --forwarded-allow-ips
      - "*"
      - --access-logfile
      - "-"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_COLLECTSTATIC: "1"
      DJANGO_SKIP_MIGRATE: "1"
    # Aislamiento de recursos (hallazgo S-08): sin límites, un pico de `web` podía
    # llevarse por delante a `db` en el mismo host y convertir una degradación en
    # indisponibilidad total. Ajusta los valores a la RAM real de tu host: la suma de
    # todos los servicios debe quedar holgadamente por debajo.
    mem_limit: ${WEB_MEM_LIMIT:-768m}
    cpus: ${WEB_CPUS:-1.5}
    pids_limit: 256
    # La imagen ya corre como usuario sin privilegios (uid 1000) y gunicorn escucha en
    # el 8000, así que no necesita ninguna capacidad del kernel.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5).status==200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SKIP_MIGRATE: "1"
    mem_limit: ${WORKER_MEM_LIMIT:-512m}
    cpus: ${WORKER_CPUS:-1.0}
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      # Un worker colgado no responde al ping por el broker (a diferencia de un
      # simple chequeo de proceso, que un cuelgue no detectaría).
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$(hostname) -t 10 >/dev/null 2>&1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s

  beat:
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SKIP_MIGRATE: "1"
    mem_limit: ${BEAT_MEM_LIMIT:-256m}
    cpus: ${BEAT_CPUS:-0.5}
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      # Beat actualiza su archivo de agenda al programar; si se cuelga y deja de
      # programar, el mtime se vuelve obsoleto (umbral holgado sobre el tick de 60s).
      test: ["CMD-SHELL", "python -c \"import os,sys,time; f='/app/celerybeat-schedule'; sys.exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f)<300 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  db:
    mem_limit: ${DB_MEM_LIMIT:-1g}
    cpus: ${DB_CPUS:-2.0}
    # db y redis NO llevan cap_drop: ALL — sus imágenes oficiales arrancan como root
    # para preparar el directorio de datos y luego bajan de usuario, lo que exige
    # CHOWN/SETUID/SETGID/DAC_OVERRIDE. Se les aplica no-new-privileges, que sí es seguro.
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Redis autenticado (REDIS_PASSWORD obligatorio; ver .env.prod.example).
  redis:
    # noeviction: broker de Celery, no descartar tareas encoladas (ver compose base).
    command: "redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD requerido en produccion}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
    # Por encima del maxmemory de 256mb del propio Redis, para que sea él quien aplique
    # su política y no el OOM killer del host quien mate el proceso.
    mem_limit: ${REDIS_MEM_LIMIT:-384m}
    cpus: ${REDIS_CPUS:-0.5}
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Proxy inverso con TLS automático. Sirve /media/ directo desde el volumen; el resto va a
  # gunicorn (estáticos vía WhiteNoise). web NO se publica al host: solo el proxy es accesible.
  proxy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
    mem_limit: ${PROXY_MEM_LIMIT:-128m}
    cpus: ${PROXY_CPUS:-1.0}
    pids_limit: 128
    # Caddy sí necesita una capacidad: enlazar los puertos 80 y 443 (privilegiados).
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  caddydata:
  caddyconfig:
