# Override de PRODUCCIÓN. No carga docker-compose.override.yml → usa el código de la imagen.
#
#   cp .env.prod.example .env   &&   editar .env (SECRET_KEY, contraseñas, SITE_ADDRESS…)
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   # migraciones y grupos, como paso de despliegue (web no los corre al arrancar):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --entrypoint python web manage.py migrate
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --entrypoint python web manage.py setup_groups
#
# Caddy (proxy) termina TLS automáticamente (Let's Encrypt) cuando SITE_ADDRESS es un dominio.
# Ver docs/despliegue.md.

services:
  web:
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - ${GUNICORN_WORKERS:-3}
      # Con hilos, gunicorn usa la clase gthread en vez de sync: una petición lenta ya
      # no bloquea un proceso entero, así que el paralelismo efectivo pasa de 3 a 12
      # (hallazgo S-07). Los timeouts del borde están en infra/caddy/Caddyfile.
      - --threads
      - ${GUNICORN_THREADS:-4}
      - --timeout
      - "30"
      - --graceful-timeout
      - "30"
      - --max-requests
      - "1000"
      - --max-requests-jitter
      - "100"
      - --forwarded-allow-ips
      - "*"
      - --access-logfile
      - "-"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_COLLECTSTATIC: "1"
      DJANGO_SKIP_MIGRATE: "1"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5).status==200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SKIP_MIGRATE: "1"
    restart: unless-stopped
    healthcheck:
      # Un worker colgado no responde al ping por el broker (a diferencia de un
      # simple chequeo de proceso, que un cuelgue no detectaría).
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$(hostname) -t 10 >/dev/null 2>&1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s

  beat:
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SKIP_MIGRATE: "1"
    restart: unless-stopped
    healthcheck:
      # Beat actualiza su archivo de agenda al programar; si se cuelga y deja de
      # programar, el mtime se vuelve obsoleto (umbral holgado sobre el tick de 60s).
      test: ["CMD-SHELL", "python -c \"import os,sys,time; f='/app/celerybeat-schedule'; sys.exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f)<300 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  db:
    restart: unless-stopped

  # Redis autenticado (REDIS_PASSWORD obligatorio; ver .env.prod.example).
  redis:
    # noeviction: broker de Celery, no descartar tareas encoladas (ver compose base).
    command: "redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD requerido en produccion}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
    restart: unless-stopped

  # Proxy inverso con TLS automático. Sirve /media/ directo desde el volumen; el resto va a
  # gunicorn (estáticos vía WhiteNoise). web NO se publica al host: solo el proxy es accesible.
  proxy:
    image: caddy:2-alpine
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddydata:
  caddyconfig:
