title = "Reseñas — configuración de gitleaks"

# Usa el conjunto de reglas por defecto de gitleaks y añade una allowlist para los
# secretos de PRUEBA usados solo en CI (no son credenciales reales: existen para
# satisfacer el guard `check --deploy` y los smokes con DEBUG=0).
[extend]
useDefault = true

# La allowlist perdona solo esos valores exactos (patrones anclados), en cualquier archivo:
# no son credenciales, y un secreto real no puede coincidir con ellos. No se acota por rutas:
# en esta versión de gitleaks, una ruta de la lista perdonaría cualquier secreto que hubiera
# en ese archivo. El job security del CI lo comprueba con un token inventado en un workflow.
[allowlist]
description = "Secretos de prueba de CI (valores exactos)"
regexes = [
  '''^ci-secret-key$''',
  '''^ci-smoke-key$''',
  '''^ci-prod-secret-Kx7mQ9vLpZ4wR8nT3bY6cF1jH5dG0sA2eU7oI4aN9qW$''',
  '''^ci-strong-db-password$''',
  '''^ci-strong-redis-password$''',
]
